# The standalone MOKE application as an installable package: Transport_MOKE.py
# plus the transport package beside it.  `pip install transport_ppms-<version>-py3-none-any.whl`
# adds the `transport-moke` command; `python Transport_MOKE.py` in a copied
# folder works too.  The version follows APP_VERSION in transport/moke/app.py.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-moke"
version = "1.0.2"
description = "Magneto-optic Kerr imaging and current-induced domain-wall motion control program (Tk GUI): the MOKE and CIDWM pages of Transport-all as a program of their own"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# As on the development Mac and in CI.  Instrument libraries that need a
# vendor install (see requirements.txt)
# are added on the lab PC (requirements.txt).
dependencies = ["numpy", "pillow", "pyvisa", "pyserial", "opencv-python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/nbb2026/Transport-all/tree/Transport-MOKE"

[project.scripts]
transport-moke = "transport.moke.app:run"

[tool.setuptools]
py-modules = ["Transport_MOKE"]
packages = [
    "transport",
    "transport.common",
    "transport.core",
    "transport.moke",
    "transport.ppms",
    "transport.ppms.controllers",
]
