# The standalone PPMS application as an installable package: Transport_PPMS.py
# plus the transport package beside it.  `pip install transport_ppms-<version>-py3-none-any.whl`
# adds the `transport-ppms` command; `python Transport_PPMS.py` in a copied
# folder works too.  The version is APP_VERSION of tools/ppms_host.py.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-ppms"
version = "1.0"
description = "PPMS transport measurement control program (Tk GUI): the PPMS page of Transport-all as a program of its own"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# As on the development Mac and in CI.  Instrument libraries that need a
# vendor install (zhinst for the MFLI, pythonnet and MultiPyVu for the PPMS)
# are added on the lab PC (requirements.txt).
dependencies = ["numpy", "pillow", "pyvisa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/nbb2026/Transport-all/tree/Transport-PPMS"

[project.scripts]
transport-ppms = "transport.ppms.app:run"

[tool.setuptools]
py-modules = ["Transport_PPMS"]
packages = [
    "transport",
    "transport.common",
    "transport.core",
    "transport.ppms",
    "transport.ppms.controllers",
]
