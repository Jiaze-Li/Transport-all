# The standalone FMR application as an installable package: Transport_FMR.py
# plus the transport package beside it.  `pip install transport_fmr-<version>-py3-none-any.whl`
# adds the `transport-fmr` command; `python Transport_FMR.py` in a copied
# folder works too.  The version is APP_VERSION of tools/fmr_host.py.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-fmr"
version = "1.0"
description = "Ferromagnetic resonance (VNA-FMR) and spin-torque FMR measurement control program (Tk GUI): the FMR and STFMR pages of Transport-all as a program of their own"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# As on the development Mac and in CI.  Instrument libraries that need a
# vendor install (see requirements.txt)
# are added on the lab PC (requirements.txt).
dependencies = ["numpy", "pillow", "pyvisa", "pyserial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/nbb2026/Transport-all/tree/Transport-FMR"

[project.scripts]
transport-fmr = "transport.fmr.app:run"

[tool.setuptools]
py-modules = ["Transport_FMR"]
packages = [
    "transport",
    "transport.common",
    "transport.core",
    "transport.fmr",
    "transport.ppms",
    "transport.ppms.controllers",
]
